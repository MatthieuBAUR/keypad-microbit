
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Commande micro:bit</title>

<style>

/* =====================================
   STYLE GENERAL
===================================== */

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Calibri, Arial, sans-serif;
    color: #dff8ff;
    background: radial-gradient(ellipse at top, #15364d, #07131f 65%, #02070d);
}

/* =====================================
   PANNEAU PRINCIPAL
===================================== */

.panneau {
    width: 100%;
    max-width: 430px;
    padding: 12px;
    background: linear-gradient(145deg, #263c4d, #0b1722 45%, #142a3a);
    border: 2px solid #247ca9;
    border-radius: 14px;
    box-shadow: 0 0 12px #00bfff,
                0 0 25px rgba(0,174,255,.3),
                inset 0 0 20px rgba(0,140,220,.12);
}

/* =====================================
   TITRE
===================================== */

.entete {
    text-align: center;
    padding: 3px 0 9px;
    border-bottom: 1px solid #087eae;
    margin-bottom: 10px;
}

.entete h1 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #36d9ff;
    text-shadow: 0 0 5px #00bfff, 0 0 15px #00aaff;
}

.sous-titre {
    margin-top: 3px;
    font-size: 9px;
    letter-spacing: 3px;
    color: #779eb4;
}

/* =====================================
   SELECTEUR USB / BLUETOOTH
===================================== */

.choix-mode {
    margin-bottom: 11px;
    padding: 9px;
    background: #071722;
    border: 1px solid #174a63;
    border-radius: 8px;
}

.mode-label {
    display: block;
    text-align: center;
    margin-bottom: 8px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #8ec9e8;
}

.selecteur {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 4px;
    background: #020b12;
    border: 1px solid #24516a;
    border-radius: 8px;
    overflow: hidden;
}

.selecteur button {
    position: relative;
    z-index: 2;
    min-height: 39px;
    border: none;
    background: transparent;
    color: #7195a8;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .25s;
}

.selecteur button.actif {
    color: #ffffff;
    text-shadow: 0 0 8px currentColor;
}

.selecteur button:disabled {
    cursor: not-allowed;
}

.indicateur-mode {
    position: absolute;
    z-index: 1;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc(50% - 4px);
    border-radius: 6px;
    background: linear-gradient(145deg, #087c54, #06442f);
    border: 1px solid #00ff99;
    box-shadow: 0 0 10px rgba(0,255,140,.4);
    transition: transform .25s;
}

.selecteur.bluetooth .indicateur-mode {
    transform: translateX(100%);
    background: linear-gradient(145deg, #0877a9, #103653);
    border-color: #18baff;
    box-shadow: 0 0 10px rgba(0,174,255,.5);
}

.mode-description {
    text-align: center;
    margin-top: 7px;
    font-size: 10px;
    color: #779eb4;
}

/* =====================================
   CONNEXION
===================================== */

.connexion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 11px;
}

.etat {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 9px;
    background: #071722;
    border: 1px solid #174a63;
    border-radius: 7px;
    font-size: 12px;
    flex: 1;
    min-width: 0;
}

.voyant {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #e0a32c;
    box-shadow: 0 0 8px #e0a32c;
}

.voyant.connecte {
    background: #21ff83;
    box-shadow: 0 0 8px #21ff83, 0 0 15px #21ff83;
    animation: pulsation 1.5s infinite;
}

.voyant.erreur {
    background: #ff3434;
    box-shadow: 0 0 10px #ff3434;
}

@keyframes pulsation {
    50% { opacity: .45; }
}

.bouton-connexion {
    padding: 7px 9px;
    color: #dff8ff;
    background: linear-gradient(145deg, #163c56, #071c2d);
    border: 1px solid #18baff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
}

.bouton-connexion:hover:not(:disabled) {
    background: #0877a9;
    box-shadow: 0 0 12px #00bfff;
}

.bouton-connexion:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* =====================================
   ECRAN
===================================== */

.ecran {
    padding: 9px;
    margin-bottom: 12px;
    text-align: center;
    background: linear-gradient(180deg, #020a12, #061b2a);
    border: 2px solid #00c8ff;
    border-radius: 9px;
    box-shadow: 0 0 10px #00bfff,
                inset 0 0 15px rgba(0,174,255,.18);
}

.ecran-label {
    color: #8ec9e8;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 3px;
}

#affichageCode {
    width: 100%;
    min-height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #26eaff;
    font-family: "Courier New", monospace;
    font-size: 39px;
    font-weight: bold;
    letter-spacing: 7px;
    text-shadow: 0 0 5px #00eaff,
                 0 0 15px #00bfff,
                 0 0 25px #0088ff;
    overflow-wrap: anywhere;
}

#affichageCode.vide {
    color: #315d70;
    text-shadow: none;
    letter-spacing: 2px;
    font-size: 19px;
}

.indication {
    margin-top: 3px;
    color: #527f94;
    font-size: 9px;
    letter-spacing: 2px;
}

/* =====================================
   CLAVIER
===================================== */

.clavier {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.touche {
    min-height: 49px;
    border-radius: 7px;
    cursor: pointer;
    color: #e1faff;
    font-family: "Courier New", monospace;
    font-size: 25px;
    font-weight: bold;
    background: linear-gradient(145deg,#29485e,#0b1a27 65%,#122d40);
    border: 1px solid #168dc5;
    box-shadow: 0 3px 0 #06101a,
                0 0 7px rgba(0,174,255,.3),
                inset 0 1px 4px rgba(130,220,255,.15);
    text-shadow: 0 0 8px #00bfff;
    transition: all .12s;
}

.touche:hover:not(:disabled) {
    background: linear-gradient(145deg,#17648b,#0c2b42);
    border-color: #48dcff;
    box-shadow: 0 0 13px #00bfff;
}

.touche:active:not(:disabled) {
    transform: translateY(2px);
}

.touche:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.touche.action {
    color: #ff7777;
    border-color: #d83b4b;
    text-shadow: 0 0 8px red;
}

.touche.effacer {
    color: #66dfff;
    font-size: 22px;
}

.touche.envoyer {
    grid-column: 4;
    grid-row: 3 / span 2;
    min-height: 105px;
    color: #aaffd0;
    font-family: Calibri,Arial,sans-serif;
    font-size: 16px;
    background: linear-gradient(145deg,#087c54,#063a2b);
    border: 1px solid #00ff99;
    text-shadow: 0 0 10px #00ff99;
    box-shadow: 0 0 10px rgba(0,255,140,.4);
}

.touche.envoyer:hover:not(:disabled) {
    background: linear-gradient(145deg,#0bbd77,#075b3e);
    box-shadow: 0 0 18px #00ff99;
}

.icone-envoi {
    display: block;
    font-size: 25px;
    margin-bottom: 3px;
}

/* =====================================
   FERMER LA PORTE
===================================== */

.fermer-porte {
    width: 100%;
    min-height: 53px;
    padding: 8px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    background: linear-gradient(145deg,#a91e2c,#4a0911);
    border: 2px solid #ff4350;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 0 10px #ffb0b0;
    box-shadow: 0 0 10px rgba(255,30,50,.4);
}

.fermer-porte:hover:not(:disabled) {
    background: linear-gradient(145deg,#e52d3c,#790e1a);
    box-shadow: 0 0 20px #ff273d;
}

.fermer-porte:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* =====================================
   TELECHARGEMENT
===================================== */

.telecharger-code {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 9px 8px;
    text-align: center;
    text-decoration: none;
    color: #8feaff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    background: linear-gradient(145deg,#16445e,#071c2d);
    border: 1px solid #18baff;
    border-radius: 7px;
    box-shadow: 0 0 8px rgba(0,174,255,.25);
}

/* =====================================
   MESSAGES
===================================== */

.message {
    min-height: 17px;
    text-align: center;
    margin-top: 8px;
    font-size: 11px;
    color: #7ca8bd;
}

.message.succes {
    color: #34ff9b;
    text-shadow: 0 0 8px #00ff88;
}

.message.erreur {
    color: #ff5b68;
    text-shadow: 0 0 8px red;
}

.message.attente {
    color: #ffc857;
}

.pied {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid #17435b;
    text-align: center;
    color: #416b80;
    font-size: 8px;
    letter-spacing: 2px;
}

/* =====================================
   PETITS ECRANS
===================================== */

@media (max-width:360px) {

    .panneau { padding: 9px; }

    .connexion { flex-wrap: wrap; }

    .etat { flex-basis: 100%; }

    .touche {
        min-height: 44px;
        font-size: 22px;
    }

    .touche.envoyer { min-height: 95px; }

    #affichageCode { font-size: 32px; }

    .fermer-porte { font-size: 15px; }
}

@media (max-height:700px) {

    body {
        padding: 4px;
        align-items: flex-start;
    }

    .panneau { padding: 8px; }

    .entete {
        padding: 2px 0 6px;
        margin-bottom: 7px;
    }

    .entete h1 { font-size: 22px; }

    .connexion { margin-bottom: 7px; }

    .ecran {
        padding: 6px;
        margin-bottom: 8px;
    }

    #affichageCode {
        min-height: 35px;
        font-size: 32px;
    }

    .clavier {
        gap: 5px;
        margin-bottom: 8px;
    }

    .touche { min-height: 42px; }

    .touche.envoyer { min-height: 89px; }

    .fermer-porte { min-height: 46px; }

    .telecharger-code {
        margin-top: 6px;
        padding: 7px;
    }

    .message { margin-top: 5px; }

    .pied {
        margin-top: 5px;
        padding-top: 5px;
    }
}

</style>
</head>

<body>

<div class="panneau">

    <div class="entete">
        <h1>Commande micro:bit</h1>
        <div class="sous-titre">
            ACCESS CONTROL SYSTEM FOR MICRO:BIT
        </div>
    </div>


    <!-- SELECTEUR USB / BLUETOOTH -->

    <div class="choix-mode">

        <span class="mode-label">MODE DE COMMUNICATION</span>

        <div class="selecteur" id="selecteurMode">

            <div class="indicateur-mode"></div>

            <button id="modeUSB" class="actif">
                USB
            </button>

            <button id="modeBluetooth">
                BLUETOOTH
            </button>

        </div>

        <div class="mode-description" id="descriptionMode">
            Connexion filaire par câble USB
        </div>

    </div>


    <!-- CONNEXION -->

    <div class="connexion">

        <div class="etat">
            <span id="voyant" class="voyant"></span>
            <span id="texteConnexion">Non connectee</span>
        </div>

        <button id="connecter" class="bouton-connexion">
            Connecter
        </button>

        <button id="deconnecter" class="bouton-connexion" disabled>
            Deconnecter
        </button>

    </div>


    <!-- ECRAN -->

    <div class="ecran">

        <div class="ecran-label">
            Code a envoyer
        </div>

        <div id="affichageCode" class="vide">
            ENTREZ LE CODE
        </div>

        <div class="indication">
            CLAVIER NUMERIQUE
        </div>

    </div>


    <!-- CLAVIER -->

    <div class="clavier">

        <button class="touche" data-chiffre="1" disabled>1</button>
        <button class="touche" data-chiffre="2" disabled>2</button>
        <button class="touche" data-chiffre="3" disabled>3</button>
        <button class="touche action" id="retour" disabled>←</button>

        <button class="touche" data-chiffre="4" disabled>4</button>
        <button class="touche" data-chiffre="5" disabled>5</button>
        <button class="touche" data-chiffre="6" disabled>6</button>
        <button class="touche effacer" id="effacer" disabled>C</button>

        <button class="touche" data-chiffre="7" disabled>7</button>
        <button class="touche" data-chiffre="8" disabled>8</button>
        <button class="touche" data-chiffre="9" disabled>9</button>

        <button class="touche envoyer" id="envoyer" disabled>
            <span class="icone-envoi">➤</span>
            ENVOYER
        </button>

        <button class="touche" data-chiffre="0" disabled>0</button>

    </div>


    <!-- FERMER LA PORTE -->

    <button id="fermerPorte" class="fermer-porte" disabled>
        FERMER LA PORTE
    </button>


    <!-- TELECHARGEMENT Lien vers la page à modifier -->

    <a class="telecharger-code"
       href="https://drive.google.com/uc?export=download&id=1sRKAHCDoUSd5fiGIwbgIBotS-tTrCqxg"
       target="_blank"
       rel="noopener noreferrer">

        Télécharger les fichiers .hex pour la carte

    </a>


    <div id="message" class="message">
        En attente de connexion USB...
    </div>

    <div class="pied">
        ACCESS CONTROL SYSTEM CODED BY MBAUR
    </div>

</div>


<script>

// =====================================
// CONFIGURATION
// =====================================

const VITESSE_USB = 115200;

const SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

// UUID conserve de ton programme Bluetooth initial
const RX_UUID =
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";


// =====================================
// VARIABLES
// =====================================

let mode = "USB";

let portUSB = null;

let deviceBluetooth = null;
let serveurBluetooth = null;
let caracteristiqueBluetooth = null;

let code = "";
let verrouEnvoi = false;


// =====================================
// ELEMENTS HTML
// =====================================

const affichageCode = document.getElementById("affichageCode");
const message = document.getElementById("message");
const voyant = document.getElementById("voyant");
const texteConnexion = document.getElementById("texteConnexion");

const boutonConnecter = document.getElementById("connecter");
const boutonDeconnecter = document.getElementById("deconnecter");
const boutonEnvoyer = document.getElementById("envoyer");
const boutonFermer = document.getElementById("fermerPorte");

const boutonUSB = document.getElementById("modeUSB");
const boutonBluetooth = document.getElementById("modeBluetooth");

const selecteur = document.getElementById("selecteurMode");
const descriptionMode = document.getElementById("descriptionMode");


// =====================================
// AFFICHAGE
// =====================================

function afficherMessage(texte, type = "") {

    message.textContent = texte;
    message.className = "message";

    if (type) {
        message.classList.add(type);
    }

}


function afficherCode() {

    if (code === "") {

        affichageCode.textContent = "ENTREZ LE CODE";
        affichageCode.classList.add("vide");

    } else {

        affichageCode.textContent = code;
        affichageCode.classList.remove("vide");

    }

}


// =====================================
// ETAT DE CONNEXION
// =====================================

function estConnecte() {

    if (mode === "USB") {
        return portUSB !== null;
    }

    return caracteristiqueBluetooth !== null &&
           deviceBluetooth !== null &&
           deviceBluetooth.gatt.connected;

}


function definirEtatConnecte(connecte) {

    if (connecte) {

        voyant.className = "voyant connecte";

        texteConnexion.textContent =
            mode === "USB" ? "Connectee en USB" : "Connectee en Bluetooth";

    } else {

        voyant.className = "voyant";
        texteConnexion.textContent = "Non connectee";

    }

    boutonConnecter.disabled = connecte;
    boutonDeconnecter.disabled = !connecte;

    boutonUSB.disabled = connecte;
    boutonBluetooth.disabled = connecte;

    document.querySelectorAll("[data-chiffre]").forEach(b => {
        b.disabled = !connecte;
    });

    document.getElementById("effacer").disabled = !connecte;
    document.getElementById("retour").disabled = !connecte;

    boutonEnvoyer.disabled = !connecte;
    boutonFermer.disabled = !connecte;

}


// =====================================
// CHANGEMENT DE MODE
// =====================================

function changerMode(nouveauMode) {

    if (estConnecte()) return;

    mode = nouveauMode;

    const bluetooth = mode === "BLUETOOTH";

    selecteur.classList.toggle("bluetooth", bluetooth);

    boutonUSB.classList.toggle("actif", !bluetooth);
    boutonBluetooth.classList.toggle("actif", bluetooth);

    descriptionMode.textContent = bluetooth
        ? "Connexion sans fil par Bluetooth"
        : "Connexion filaire par câble USB";

    afficherMessage(
        bluetooth
        ? "Mode Bluetooth selectionne"
        : "Mode USB selectionne",
        ""
    );

}


boutonUSB.onclick = () => changerMode("USB");

boutonBluetooth.onclick = () => changerMode("BLUETOOTH");


// =====================================
// CLAVIER NUMERIQUE
// =====================================

function ajouterChiffre(chiffre) {

    if (!estConnecte() || verrouEnvoi) return;

    if (code.length >= 12) {

        afficherMessage("Longueur maximale atteinte", "erreur");
        return;

    }

    code += chiffre;

    afficherCode();

    afficherMessage("Code en cours de saisie");

}


function effacerCode() {

    code = "";
    afficherCode();
    afficherMessage("Saisie effacee");

}


function supprimerDernier() {

    code = code.slice(0, -1);
    afficherCode();
    afficherMessage("Dernier chiffre supprime");

}


document.querySelectorAll("[data-chiffre]").forEach(bouton => {

    bouton.addEventListener("click", function() {
        ajouterChiffre(this.dataset.chiffre);
    });

});

document.getElementById("effacer").onclick = effacerCode;
document.getElementById("retour").onclick = supprimerDernier;


// =====================================
// CONNEXION USB
// =====================================

async function connecterUSB() {

    if (!("serial" in navigator)) {

        throw new Error(
            "Web Serial indisponible. Utilise Chrome ou Edge en HTTPS."
        );

    }

    afficherMessage("Selection du port USB...", "attente");

    portUSB = await navigator.serial.requestPort();

    afficherMessage("Ouverture du port USB...", "attente");

    await portUSB.open({
        baudRate: VITESSE_USB
    });

    portUSB.addEventListener("disconnect", deconnexionUSB);

    definirEtatConnecte(true);

    afficherMessage("Connexion USB etablie", "succes");

}


async function deconnexionUSB() {

    const ancienPort = portUSB;

    portUSB = null;

    definirEtatConnecte(false);

    if (ancienPort) {

        try {
            await ancienPort.close();
        } catch(erreur) {
            console.error(erreur);
        }

    }

    afficherMessage("Connexion USB interrompue", "erreur");

}


// =====================================
// CONNEXION BLUETOOTH
// =====================================

async function connecterBluetooth() {

    if (!navigator.bluetooth) {

        throw new Error(
            "Bluetooth indisponible. Utilise Chrome ou Edge."
        );

    }

    afficherMessage("Recherche de la micro:bit...", "attente");

    deviceBluetooth = await navigator.bluetooth.requestDevice({

        acceptAllDevices: true,

        optionalServices: [SERVICE_UUID]

    });

    deviceBluetooth.addEventListener(
        "gattserverdisconnected",
        deconnexionBluetooth
    );

    afficherMessage("Connexion Bluetooth...", "attente");

    serveurBluetooth = await deviceBluetooth.gatt.connect();

    const service = await serveurBluetooth.getPrimaryService(
        SERVICE_UUID
    );

    const caracteristiques = await service.getCharacteristics();

    caracteristiqueBluetooth = null;

    for (const c of caracteristiques) {

        console.log("Caracteristique :", c.uuid, c.properties);

        if (
            c.uuid.toLowerCase() === RX_UUID &&
            (
                c.properties.write ||
                c.properties.writeWithoutResponse
            )
        ) {

            caracteristiqueBluetooth = c;

        }

    }

    if (!caracteristiqueBluetooth) {

        throw new Error(
            "Caracteristique UART Bluetooth introuvable ou non inscriptible."
        );

    }

    definirEtatConnecte(true);

    afficherMessage(
        "Connexion Bluetooth etablie avec " +
        (deviceBluetooth.name || "micro:bit"),
        "succes"
    );

}


function deconnexionBluetooth() {

    caracteristiqueBluetooth = null;
    serveurBluetooth = null;
    deviceBluetooth = null;

    definirEtatConnecte(false);

    afficherMessage("Micro:bit Bluetooth deconnectee", "erreur");

}


// =====================================
// BOUTON CONNECTER
// =====================================

boutonConnecter.onclick = async function() {

    boutonConnecter.disabled = true;

    try {

        if (mode === "USB") {

            await connecterUSB();

        } else {

            await connecterBluetooth();

        }

    }

    catch(erreur) {

        console.error(erreur);

        caracteristiqueBluetooth = null;
        serveurBluetooth = null;
        portUSB = null;

        definirEtatConnecte(false);

        afficherMessage(
            "Erreur : " + erreur.message,
            "erreur"
        );

    }

};


// =====================================
// DECONNEXION
// =====================================

boutonDeconnecter.onclick = async function() {

    if (mode === "USB") {

        await deconnexionUSB();

    } else {

        if (deviceBluetooth && deviceBluetooth.gatt.connected) {

            deviceBluetooth.gatt.disconnect();

        } else {

            deconnexionBluetooth();

        }

    }

};


// =====================================
// ENVOI USB
// =====================================

async function envoyerUSB(valeur) {

    if (!portUSB || !portUSB.writable) {

        throw new Error("Port USB non disponible");

    }

    const donnees = new TextEncoder().encode(valeur + "\n");

    const writer = portUSB.writable.getWriter();

    try {

        await writer.write(donnees);

    } finally {

        writer.releaseLock();

    }

}


// =====================================
// ENVOI BLUETOOTH
// =====================================

async function envoyerBluetooth(valeur) {

    if (!caracteristiqueBluetooth) {

        throw new Error("Bluetooth non connecte");

    }

    const donnees = new TextEncoder().encode(valeur + "\n");

    if (caracteristiqueBluetooth.properties.writeWithoutResponse) {

        await caracteristiqueBluetooth.writeValueWithoutResponse(donnees);

    } else {

        await caracteristiqueBluetooth.writeValueWithResponse(donnees);

    }

}


// =====================================
// FONCTION GENERALE D'ENVOI
// =====================================

async function envoyerCode(valeur) {

    if (!estConnecte()) {

        afficherMessage("Carte non connectee", "erreur");
        return false;

    }

    if (verrouEnvoi) return false;

    verrouEnvoi = true;

    boutonEnvoyer.disabled = true;
    boutonFermer.disabled = true;

    try {

        if (mode === "USB") {

            await envoyerUSB(valeur);

        } else {

            await envoyerBluetooth(valeur);

        }

        afficherMessage(
            "Code envoye : " + valeur + " (" + mode + ")",
            "succes"
        );

        return true;

    }

    catch(erreur) {

        console.error(erreur);

        afficherMessage(
            "Erreur d'envoi : " + erreur.message,
            "erreur"
        );

        return false;

    }

    finally {

        verrouEnvoi = false;

        const connecte = estConnecte();

        boutonEnvoyer.disabled = !connecte;
        boutonFermer.disabled = !connecte;

    }

}


// =====================================
// BOUTON ENVOYER
// =====================================

boutonEnvoyer.onclick = async function() {

    if (code === "") {

        afficherMessage("Saisis d'abord un code", "erreur");
        return;

    }

    const codeEnvoye = code;

    const succes = await envoyerCode(codeEnvoye);

    if (succes) {

        code = "";
        afficherCode();

    }

};


// =====================================
// FERMER LA PORTE
// =====================================

boutonFermer.onclick = async function() {

    await envoyerCode("0000");

};


// =====================================
// VERIFICATION DU NAVIGATEUR
// =====================================

if (!("serial" in navigator)) {

    afficherMessage(
        "USB indisponible : utilise Chrome ou Edge en HTTPS.",
        "attente"
    );

}

if (!navigator.bluetooth) {

    console.warn("Web Bluetooth indisponible");

}


// =====================================
// INITIALISATION
// =====================================

definirEtatConnecte(false);

afficherCode();

</script>
